<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Shooter GUI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Crosshair */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
        }

        .crosshair-line {
            position: absolute;
            background: rgba(0, 255, 0, 0.8);
        }

        .crosshair-h {
            width: 15px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .crosshair-v {
            width: 2px;
            height: 15px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .crosshair-dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(0, 255, 0, 0.8);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Bottom Left - Ammo & Weapon */
        #ammo-section {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: #0f0;
            font-size: 24px;
            text-shadow: 0 0 10px #0f0;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #magazine {
            font-size: 48px;
            margin: 10px 0;
        }

        #total-ammo {
            font-size: 20px;
            opacity: 0.8;
        }

        #weapon-name {
            font-size: 16px;
            opacity: 0.6;
            margin-top: 5px;
        }

        /* Top Left - Health & Armor */
        #health-section {
            position: absolute;
            top: 40px;
            left: 40px;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .stat-label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #999;
        }

        .stat-bar {
            width: 200px;
            height: 20px;
            background: #222;
            border: 2px solid #444;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .stat-fill {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            transition: width 0.3s ease;
        }

        #health-fill {
            background: linear-gradient(90deg, #ff4444, #ff8844);
            width: 85%;
        }

        #armor-fill {
            background: linear-gradient(90deg, #4488ff, #88ccff);
            width: 60%;
        }

        /* Top Right - Radar/Minimap */
        #minimap {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #0f0;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .radar-dot {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .player-dot {
            width: 6px;
            height: 6px;
            background: #0f0;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #0f0;
        }

        .enemy-dot {
            width: 4px;
            height: 4px;
            background: #f00;
            box-shadow: 0 0 6px #f00;
        }

        .objective-dot {
            width: 4px;
            height: 4px;
            background: #ffff00;
            box-shadow: 0 0 6px #ffff00;
        }

        /* Bottom Right - Objective & Status */
        #status-section {
            position: absolute;
            bottom: 40px;
            right: 40px;
            text-align: right;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .objective {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #0f0;
            background: rgba(0, 255, 0, 0.1);
        }

        .objective-title {
            color: #ffff00;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .fps-counter {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 20px;
        }

        /* Killstreak Indicator */
        #killstreak {
            position: absolute;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            text-align: center;
            color: #ffff00;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 15px #ffff00;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #killstreak.active {
            opacity: 1;
        }

        /* Damage Indicator */
        .damage-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.3);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .damage-flash.active {
            opacity: 1;
        }

        /* Screen Effect */
        #screen-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.03),
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            animation: scanlines 0.15s infinite;
        }

        @keyframes scanlines {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(2px);
            }
        }

        /* Corner indicators */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #0f0;
        }

        .corner-tl {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="hud">
        <!-- Damage Flash -->
        <div id="damage-flash" class="damage-flash"></div>

        <!-- Screen Effect -->
        <div id="screen-effect"></div>

        <!-- Corner Indicators -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Crosshair -->
        <div class="crosshair">
            <div class="crosshair-line crosshair-h"></div>
            <div class="crosshair-line crosshair-v"></div>
            <div class="crosshair-dot"></div>
        </div>

        <!-- Top Left - Health & Armor -->
        <div id="health-section">
            <div class="stat-label">HEALTH</div>
            <div class="stat-bar">
                <div id="health-fill" class="stat-fill">85%</div>
            </div>
            <div class="stat-label">ARMOR</div>
            <div class="stat-bar">
                <div id="armor-fill" class="stat-fill">60%</div>
            </div>
        </div>

        <!-- Top Right - Minimap -->
        <div id="minimap">
            <div class="radar-dot player-dot"></div>
            <div class="radar-dot enemy-dot" style="left: 30%; top: 25%;"></div>
            <div class="radar-dot enemy-dot" style="left: 70%; top: 60%;"></div>
            <div class="radar-dot objective-dot" style="left: 80%; top: 20%;"></div>
        </div>

        <!-- Bottom Left - Ammo -->
        <div id="ammo-section">
            <div id="magazine">120</div>
            <div id="total-ammo">| 360</div>
            <div id="weapon-name">RIFLE</div>
        </div>

        <!-- Bottom Right - Objective & Status -->
        <div id="status-section">
            <div class="objective">
                <div class="objective-title">OBJECTIVE</div>
                <div>Secure Zone Alpha</div>
                <div style="font-size: 12px; opacity: 0.7;">2:45 remaining</div>
            </div>
            <div class="fps-counter">FPS: <span id="fps-value">60</span></div>
        </div>

        <!-- Killstreak Indicator -->
        <div id="killstreak">
            <div style="font-size: 36px; margin-bottom: 10px;">🔥</div>
            <div>KILL STREAK!</div>
            <div id="killstreak-count" style="font-size: 24px;">5</div>
        </div>
    </div>

    <script>
        // Three.js Setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Create a simple 3D scene with some objects
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Add more objects
        const sphereGeometry = new THREE.SphereGeometry(0.7, 32, 32);
        const sphereMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000 });
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        sphere.position.x = 3;
        scene.add(sphere);

        const cylinderGeometry = new THREE.CylinderGeometry(0.5, 0.5, 2, 32);
        const cylinderMaterial = new THREE.MeshPhongMaterial({ color: 0x0000ff });
        const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
        cylinder.position.x = -3;
        scene.add(cylinder);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // Animation variables
        let health = 85;
        let armor = 60;
        let ammo = 120;
        let totalAmmo = 360;
        let killstreak = 0;
        let frameCount = 0;
        let fps = 60;
        let lastTime = Date.now();

        // Update HUD values
        function updateHUD() {
            document.getElementById('health-fill').style.width = health + '%';
            document.getElementById('health-fill').textContent = health + '%';
            
            document.getElementById('armor-fill').style.width = armor + '%';
            document.getElementById('armor-fill').textContent = armor + '%';
            
            document.getElementById('magazine').textContent = ammo;
            document.getElementById('total-ammo').textContent = '| ' + totalAmmo;
            
            if (killstreak > 0) {
                document.getElementById('killstreak').classList.add('active');
                document.getElementById('killstreak-count').textContent = killstreak;
            } else {
                document.getElementById('killstreak').classList.remove('active');
            }
        }

        // Simulate HUD changes
        function simulateGameplay() {
            // Random events
            if (Math.random() < 0.02) {
                ammo = Math.max(0, ammo - Math.floor(Math.random() * 10));
                killstreak++;
            }

            if (Math.random() < 0.01) {
                health = Math.max(0, health - Math.floor(Math.random() * 15));
                triggerDamageFlash();
            }

            if (Math.random() < 0.005) {
                armor = Math.max(0, armor - Math.floor(Math.random() * 10));
            }

            // Regenerate ammo
            if (ammo < 50) {
                ammo = Math.min(120, ammo + 0.5);
            }

            // Killstreak timeout
            if (Math.random() < 0.001) {
                killstreak = 0;
            }

            updateHUD();
        }

        // Damage flash effect
        function triggerDamageFlash() {
            const flash = document.getElementById('damage-flash');
            flash.classList.remove('active');
            void flash.offsetWidth; // Trigger reflow
            flash.classList.add('active');
        }

        // FPS Counter
        function updateFPS() {
            frameCount++;
            const currentTime = Date.now();
            if (currentTime >= lastTime + 1000) {
                fps = frameCount;
                document.getElementById('fps-value').textContent = fps;
                frameCount = 0;
                lastTime = currentTime;
            }
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Rotate objects
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            sphere.rotation.y += 0.01;
            cylinder.rotation.z += 0.01;

            // Update radar
            updateRadar();

            // Simulate gameplay
            simulateGameplay();

            // Update FPS
            updateFPS();

            renderer.render(scene, camera);
        }

        // Radar update
        function updateRadar() {
            const enemyDots = document.querySelectorAll('.enemy-dot');
            enemyDots.forEach((dot, index) => {
                const angle = Date.now() * 0.0005 + (index * Math.PI * 2 / enemyDots.length);
                const radius = 40;
                const x = 75 + radius * Math.cos(angle);
                const y = 75 + radius * Math.sin(angle);
                dot.style.left = x + 'px';
                dot.style.top = y + 'px';
            });
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') ammo = Math.max(0, ammo - 5);
            if (e.key === '2') health = Math.max(0, health - 10);
            if (e.key === '3') killstreak++;
            if (e.key === '4') armor = Math.max(0, armor - 10);
            if (e.key === ' ') triggerDamageFlash();
        });

        // Start animation
        animate();

        // Initial HUD update
        updateHUD();

        console.log('%cShooter GUI Loaded', 'color: #0f0; font-size: 16px; font-weight: bold;');
        console.log('%cPress keys: 1=Shoot, 2=Take Damage, 3=Killstreak, 4=Lose Armor, Space=Damage Flash', 'color: #0f0;');
    </script>
</body>
</html>
