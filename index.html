<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Shooter Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Crosshair */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
        }

        .crosshair-line {
            position: absolute;
            background: rgba(0, 255, 0, 0.8);
        }

        .crosshair-h {
            width: 15px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .crosshair-v {
            width: 2px;
            height: 15px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .crosshair-dot {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(0, 255, 0, 0.8);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Bottom Left - Ammo & Weapon */
        #ammo-section {
            position: absolute;
            bottom: 40px;
            left: 40px;
            color: #0f0;
            font-size: 24px;
            text-shadow: 0 0 10px #0f0;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #magazine {
            font-size: 48px;
            margin: 10px 0;
        }

        #total-ammo {
            font-size: 20px;
            opacity: 0.8;
        }

        #weapon-name {
            font-size: 16px;
            opacity: 0.6;
            margin-top: 5px;
        }

        #reload-prompt {
            font-size: 14px;
            color: #ffff00;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #reload-prompt.active {
            opacity: 1;
        }

        /* Top Left - Health & Armor */
        #health-section {
            position: absolute;
            top: 40px;
            left: 40px;
            color: #fff;
            font-family: 'Courier New', monospace;
        }

        .stat-label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #999;
        }

        .stat-bar {
            width: 200px;
            height: 20px;
            background: #222;
            border: 2px solid #444;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .stat-fill {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            transition: width 0.3s ease;
        }

        #health-fill {
            background: linear-gradient(90deg, #ff4444, #ff8844);
            width: 100%;
        }

        #armor-fill {
            background: linear-gradient(90deg, #4488ff, #88ccff);
            width: 0%;
        }

        /* Top Right - Enemy Counter */
        #enemy-counter {
            position: absolute;
            top: 40px;
            right: 40px;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-shadow: 0 0 10px #0f0;
            border: 2px solid #0f0;
            padding: 15px;
            background: rgba(0, 0, 0, 0.7);
        }

        /* Bottom Right - Score & Status */
        #status-section {
            position: absolute;
            bottom: 40px;
            right: 40px;
            text-align: right;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .score-display {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #0f0;
            background: rgba(0, 255, 0, 0.1);
        }

        .score-title {
            color: #ffff00;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .fps-counter {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 20px;
        }

        /* Killstreak Indicator */
        #killstreak {
            position: absolute;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            text-align: center;
            color: #ffff00;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 15px #ffff00;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #killstreak.active {
            opacity: 1;
        }

        /* Damage Indicator */
        .damage-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.3);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .damage-flash.active {
            opacity: 1;
        }

        /* Screen Effect */
        #screen-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.03),
                    rgba(255, 255, 255, 0.03) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            animation: scanlines 0.15s infinite;
        }

        @keyframes scanlines {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(2px);
            }
        }

        /* Corner indicators */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #0f0;
        }

        .corner-tl {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: 20px;
            right: 20px;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: 20px;
            left: 20px;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }

        /* Instructions */
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #0f0;
            padding: 30px;
            text-align: center;
            color: #0f0;
            font-family: 'Courier New', monospace;
            z-index: 1000;
        }

        #instructions h1 {
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #0f0;
        }

        #instructions p {
            font-size: 16px;
            margin: 10px 0;
        }

        #instructions.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="hud">
        <!-- Damage Flash -->
        <div id="damage-flash" class="damage-flash"></div>

        <!-- Screen Effect -->
        <div id="screen-effect"></div>

        <!-- Corner Indicators -->
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <!-- Crosshair -->
        <div class="crosshair">
            <div class="crosshair-line crosshair-h"></div>
            <div class="crosshair-line crosshair-v"></div>
            <div class="crosshair-dot"></div>
        </div>

        <!-- Top Left - Health -->
        <div id="health-section">
            <div class="stat-label">HEALTH</div>
            <div class="stat-bar">
                <div id="health-fill" class="stat-fill">100%</div>
            </div>
        </div>

        <!-- Top Right - Enemy Counter -->
        <div id="enemy-counter">
            Enemies: <span id="enemy-count">0</span> / <span id="enemy-total">5</span>
        </div>

        <!-- Bottom Left - Ammo -->
        <div id="ammo-section">
            <div id="magazine">30</div>
            <div id="total-ammo">| 90</div>
            <div id="weapon-name">RIFLE</div>
            <div id="reload-prompt">Press R to Reload</div>
        </div>

        <!-- Bottom Right - Score & Status -->
        <div id="status-section">
            <div class="score-display">
                <div class="score-title">KILLS</div>
                <div id="kill-count">0</div>
            </div>
            <div class="fps-counter">FPS: <span id="fps-value">60</span></div>
        </div>

        <!-- Killstreak Indicator -->
        <div id="killstreak">
            <div style="font-size: 36px; margin-bottom: 10px;">🔥</div>
            <div>KILL STREAK!</div>
            <div id="killstreak-count" style="font-size: 24px;">5</div>
        </div>
    </div>

    <!-- Instructions Screen -->
    <div id="instructions">
        <h1>3D SHOOTER</h1>
        <p>CLICK to aim and shoot</p>
        <p>MOUSE MOVE to look around</p>
        <p>R to reload</p>
        <p>Destroy all enemies!</p>
        <p style="font-size: 12px; margin-top: 20px; cursor: pointer;" onclick="document.getElementById('instructions').classList.add('hidden')">Click anywhere to start</p>
    </div>

    <script>
        // Three.js Setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 100, 500);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;

        // Create ground
        const groundGeometry = new THREE.PlaneGeometry(200, 200);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x444444 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Create walls
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x666666 });
        const wallGeometry = new THREE.BoxGeometry(200, 50, 2);
        const wall1 = new THREE.Mesh(wallGeometry, wallMaterial);
        wall1.position.z = -100;
        wall1.receiveShadow = true;
        scene.add(wall1);

        const wall2 = new THREE.Mesh(wallGeometry, wallMaterial);
        wall2.position.z = 100;
        wall2.receiveShadow = true;
        scene.add(wall2);

        const wall3 = new THREE.Mesh(new THREE.BoxGeometry(2, 50, 200), wallMaterial);
        wall3.position.x = -100;
        wall3.receiveShadow = true;
        scene.add(wall3);

        const wall4 = new THREE.Mesh(new THREE.BoxGeometry(2, 50, 200), wallMaterial);
        wall4.position.x = 100;
        wall4.receiveShadow = true;
        scene.add(wall4);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 50, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);

        // Create gun model (simple)
        const gunGroup = new THREE.Group();

        // Gun barrel
        const barrelGeometry = new THREE.CylinderGeometry(0.15, 0.15, 1.5, 16);
        const gunMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8, roughness: 0.2 });
        const barrel = new THREE.Mesh(barrelGeometry, gunMaterial);
        barrel.rotation.z = Math.PI / 2;
        barrel.position.set(0.3, -0.2, -0.5);
        barrel.castShadow = true;
        gunGroup.add(barrel);

        // Gun body
        const bodyGeometry = new THREE.BoxGeometry(0.2, 0.3, 0.4);
        const body = new THREE.Mesh(bodyGeometry, gunMaterial);
        body.position.set(0.1, -0.15, -0.2);
        body.castShadow = true;
        gunGroup.add(body);

        // Gun stock
        const stockGeometry = new THREE.BoxGeometry(0.15, 0.25, 0.6);
        const stock = new THREE.Mesh(stockGeometry, gunMaterial);
        stock.position.set(-0.15, -0.1, -0.5);
        stock.castShadow = true;
        gunGroup.add(stock);

        // Create arm model
        const armGroup = new THREE.Group();

        // Upper arm
        const upperArmGeometry = new THREE.CylinderGeometry(0.12, 0.12, 0.5, 16);
        const skinMaterial = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
        const upperArm = new THREE.Mesh(upperArmGeometry, skinMaterial);
        upperArm.rotation.z = Math.PI / 2.5;
        upperArm.position.set(0.2, -0.3, -0.6);
        upperArm.castShadow = true;
        armGroup.add(upperArm);

        // Forearm
        const forearmGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.5, 16);
        const forearm = new THREE.Mesh(forearmGeometry, skinMaterial);
        forearm.rotation.z = Math.PI / 2.2;
        forearm.position.set(0.4, -0.2, -0.8);
        forearm.castShadow = true;
        armGroup.add(forearm);

        // Hand
        const handGeometry = new THREE.SphereGeometry(0.1, 16, 16);
        const hand = new THREE.Mesh(handGeometry, skinMaterial);
        hand.position.set(0.55, -0.05, -0.9);
        hand.castShadow = true;
        armGroup.add(hand);

        armGroup.add(gunGroup);
        camera.add(armGroup);

        // Game variables
        let health = 100;
        let ammo = 30;
        let totalAmmo = 90;
        let kills = 0;
        let killstreak = 0;
        let frameCount = 0;
        let fps = 60;
        let lastTime = Date.now();
        let canShoot = true;
        let isReloading = false;
        let enemies = [];
        const MAGAZINE_SIZE = 30;
        const SHOOT_COOLDOWN = 0.2;
        let shootCooldown = 0;

        // Enemy class
        class Enemy {
            constructor(x, z) {
                this.health = 1;
                const geometry = new THREE.BoxGeometry(1, 2, 1);
                const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.set(x, 1, z);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                scene.add(this.mesh);
                this.alive = true;
            }

            damage(amount) {
                this.health -= amount;
                if (this.health <= 0) {
                    this.die();
                }
            }

            die() {
                this.alive = false;
                scene.remove(this.mesh);
                kills++;
                killstreak++;
            }

            update() {
                if (this.alive) {
                    // Simple AI: move towards player
                    const direction = new THREE.Vector3();
                    direction.subVectors(camera.position, this.mesh.position);
                    direction.normalize();
                    this.mesh.position.addScaledVector(direction, 0.02);
                }
            }
        }

        // Spawn enemies
        function spawnEnemies() {
            enemies = [];
            const positions = [
                [-30, -30], [30, -30], [-30, 30], [30, 30], [0, -40]
            ];
            positions.forEach(pos => {
                enemies.push(new Enemy(pos[0], pos[1]));
            });
        }

        // Shoot function
        function shoot() {
            if (!canShoot || ammo <= 0 || isReloading) return;

            shootCooldown = SHOOT_COOLDOWN;
            canShoot = false;
            ammo--;

            // Muzzle flash animation
            barrel.scale.z = 1.2;
            setTimeout(() => {
                barrel.scale.z = 1;
            }, 50);

            // Raycast from camera
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            // Check enemy collisions
            enemies.forEach(enemy => {
                if (enemy.alive) {
                    const distance = camera.position.distanceTo(enemy.mesh.position);
                    if (raycaster.ray.distanceToPoint(enemy.mesh.position) < 1 && distance < 200) {
                        enemy.damage(1);
                    }
                }
            });

            // Update HUD
            updateHUD();

            // Auto-reload when magazine empty
            if (ammo === 0 && totalAmmo > 0) {
                reload();
            }
        }

        // Reload function
        function reload() {
            if (isReloading || totalAmmo <= 0) return;

            isReloading = true;
            const ammoNeeded = MAGAZINE_SIZE - ammo;
            const ammoToUse = Math.min(ammoNeeded, totalAmmo);
            
            ammo += ammoToUse;
            totalAmmo -= ammoToUse;

            setTimeout(() => {
                isReloading = false;
                updateHUD();
            }, 500);

            updateHUD();
        }

        // Update HUD
        function updateHUD() {
            document.getElementById('magazine').textContent = Math.floor(ammo);
            document.getElementById('total-ammo').textContent = '| ' + totalAmmo;
            document.getElementById('health-fill').style.width = health + '%';
            document.getElementById('health-fill').textContent = Math.floor(health) + '%';
            document.getElementById('kill-count').textContent = kills;
            document.getElementById('enemy-count').textContent = enemies.filter(e => e.alive).length;
            document.getElementById('killstreak-count').textContent = killstreak;

            if (killstreak > 0) {
                document.getElementById('killstreak').classList.add('active');
            } else {
                document.getElementById('killstreak').classList.remove('active');
            }

            // Show reload prompt
            if (ammo === 0 && totalAmmo > 0 && !isReloading) {
                document.getElementById('reload-prompt').classList.add('active');
            } else {
                document.getElementById('reload-prompt').classList.remove('active');
            }
        }

        // FPS Counter
        function updateFPS() {
            frameCount++;
            const currentTime = Date.now();
            if (currentTime >= lastTime + 1000) {
                fps = frameCount;
                document.getElementById('fps-value').textContent = fps;
                frameCount = 0;
                lastTime = currentTime;
            }
        }

        // Mouse move for looking
        document.addEventListener('mousemove', (e) => {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;

            const moveX = (e.clientX - centerX) * 0.0005;
            const moveY = (e.clientY - centerY) * 0.0005;

            // Rotate gun based on mouse
            armGroup.rotation.y = moveX;
            armGroup.rotation.x = -moveY;
        });

        // Click to shoot
        document.addEventListener('click', () => {
            if (!document.getElementById('instructions').classList.contains('hidden')) {
                document.getElementById('instructions').classList.add('hidden');
            } else {
                shoot();
            }
        });

        // R key to reload
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r') {
                reload();
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            shootCooldown = Math.max(0, shootCooldown - 1/60);

            // Update enemies
            enemies.forEach(enemy => {
                enemy.update();
            });

            // Update FPS
            updateFPS();

            // Check win condition
            if (enemies.every(e => !e.alive)) {
                killstreak = 0;
                spawnEnemies();
            }

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        // Pointer lock for better control
        document.addEventListener('click', () => {
            canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
            canvas.requestPointerLock();
        });

        // Start game
        spawnEnemies();
        updateHUD();
        animate();

        console.log('%c3D SHOOTER LOADED', 'color: #0f0; font-size: 16px; font-weight: bold;');
        console.log('%cCLICK to shoot | R to reload | Move mouse to aim', 'color: #0f0;');
    </script>
</body>
</html>
